<meta charset="utf-8">
<title>Nivia Aprendiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap">
<style>
/* Layout: una columna de app móvil (máx. 480 px), barra inferior fija; lección, reto y evaluación a pantalla completa. */
:root {
  color-scheme: dark;
  --bg: #0E0F11;
  --surface: #1A1C20;
  --surface2: #22252A;
  --line: #2A2D33;
  --line2: #3A3D44;
  --fg: #F2F2F0;
  --muted: #A3A6AD;
  --ok: #7FD69B;
  --okbg: #16261C;
  --rep: #F4A27A;
  --repbg: #2B1A12;
  --accent: #F26B1D;
  --on-accent: #0E0F11;
  --principal: #0E4D5C;
  --ptext: #7CC3D0;
  --paper: #FAF8F3;
  --ink: #1A1A1A;
  --ink2: #4D4D4D;
  --demo: #F2F2F0;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --gl: max(20px, env(safe-area-inset-left, 0px));
  --gr: max(20px, env(safe-area-inset-right, 0px));
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 18px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
#app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; position: relative; background: var(--bg); }
@media (min-width: 520px) { #app { border-left: 1px solid var(--line); border-right: 1px solid var(--line); } }
.ic { flex-shrink: 0; }
.scr { flex: 1; display: flex; flex-direction: column; gap: 24px; padding-block: 20px 28px; padding-left: var(--gl); padding-right: var(--gr); }
.brand { display: flex; align-items: center; gap: 10px; background: var(--principal); padding-block: 14px; padding-left: var(--gl); padding-right: var(--gr); color: var(--fg); font-weight: 600; font-size: 15px; }
.brand.logo { background: #FFFFFF; padding-block: 10px; border-bottom: 3px solid var(--principal); }
.logoplate { background: #FFFFFF; border-radius: 16px; padding: 12px 18px; display: inline-flex; }
.mono { width: 30px; height: 30px; border-radius: 9px; background: var(--fg); color: var(--principal); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
.over { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.title { font-size: 28px; line-height: 1.12; letter-spacing: -0.02em; font-weight: 200; }
.title b { font-weight: 800; }
.h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.xs { font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-s { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; }
.btn { min-height: 56px; border-radius: 16px; font-weight: 800; font-size: 17px; width: 100%; border: 0; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; text-align: center; text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:disabled { background: var(--surface2); color: var(--muted); cursor: not-allowed; }
.btn-sec { background: transparent; border: 1px solid var(--line2); color: var(--fg); font-weight: 600; }
.btn-sec:disabled { color: var(--muted); cursor: not-allowed; }
.link { background: none; border: 0; color: var(--ptext); font-weight: 600; min-height: 48px; padding: 0; display: inline-flex; align-items: center; gap: 6px; text-align: left; font-size: 16px; }
.reason { font-size: 14px; color: var(--muted); text-align: center; }
.dock { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: var(--gl); padding-right: var(--gr); z-index: 5; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-size: 15px; font-weight: 600; }
.input { min-height: 56px; width: 100%; background: var(--surface); border: 1.5px solid var(--line2); border-radius: 14px; padding: 0 16px; font-size: 18px; }
.input:focus { outline: none; border-color: var(--accent); }
.input[aria-invalid="true"] { border-color: var(--rep); }
.inwrap { position: relative; }
.inwrap .input { padding-right: 104px; }
.inwrap .show { position: absolute; right: 4px; top: 4px; height: 48px; min-width: 92px; border: 0; background: none; color: var(--ptext); font-weight: 600; font-size: 15px; }
textarea.input { min-height: 96px; padding: 14px 16px; resize: vertical; }
select.input { appearance: none; background-image: none; }
.err { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; color: var(--rep); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 5px 11px; border-radius: 99px; line-height: 1.2; white-space: nowrap; }
.pill.ok { background: var(--okbg); color: var(--ok); }
.pill.rep { background: var(--repbg); color: var(--rep); }
.pill.lock { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.pill.cur { background: var(--accent); color: var(--on-accent); }
.pill.av { border: 1px solid var(--accent); color: var(--accent); }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.block { background: var(--surface); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; font-size: 15px; }
.banner.rep { background: var(--repbg); color: var(--rep); }
.banner.info { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.offline { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; gap: 10px; align-items: center; background: var(--repbg); color: var(--rep); font-size: 14px; font-weight: 600; padding-block: 10px; padding-left: var(--gl); padding-right: var(--gr); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); padding-block: 8px 12px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: var(--gr); display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.top .row { gap: 6px; }
.exit { min-height: 48px; min-width: 48px; background: none; border: 0; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 16px; color: var(--fg); padding: 0 8px; }
.top .ctx { font-size: 13px; color: var(--muted); flex: 1; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .bar { margin-left: 8px; }
.tabs { position: sticky; bottom: 0; z-index: 8; display: flex; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs button { flex: 1; min-height: 64px; background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: var(--muted); font-weight: 600; }
.tabs button[aria-current="page"] { color: var(--accent); }
/* Inicio */
.routeitem { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.routeitem.late { border-color: var(--rep); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--muted); }
.meta b { color: var(--fg); font-weight: 600; }
.next { background: var(--surface); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--line); }
.next .thumb { display: flex; gap: 14px; align-items: center; }
.tiny-video img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tiny-video { width: 54px; height: 96px; border-radius: 10px; overflow: hidden; flex-shrink: 0; position: relative; background: var(--principal); }
.tiny-video svg.scene { width: 100%; height: 100%; display: block; }
/* Ruta */
.path { display: flex; flex-direction: column; }
.node { display: flex; gap: 14px; }
.rail { width: 48px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.dot { width: 44px; height: 44px; border-radius: 99px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.dot.done { border: 2px solid var(--accent); color: var(--accent); }
.dot.cur { border: 1px dashed var(--accent); }
.dot.cur span { width: 34px; height: 34px; border-radius: 99px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; }
.dot.av { border: 2px solid var(--accent); color: var(--fg); font-weight: 800; font-size: 15px; }
.dot.lock { border: 2px solid var(--line2); color: var(--muted); }
.trail { flex: 1; width: 0; border-left: 2px dotted var(--line2); min-height: 20px; margin: 4px 0; }
.trail.done { border-left-color: var(--accent); }
.ncontent { flex: 1; min-width: 0; padding: 4px 0 24px; display: flex; flex-direction: column; gap: 8px; }
.lessonbtn { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-height: 56px; display: flex; align-items: center; gap: 12px; }
.lessonbtn .t { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
.lockbtn { width: 100%; text-align: left; background: none; border: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; min-height: 48px; }
/* Video */
.video { position: relative; aspect-ratio: 9 / 16; width: min(100%, calc(62vh * 9 / 16)); max-width: 100%; margin: 0 auto; border-radius: 22px; overflow: hidden; background: #000; }
.vslot, .vslot video { position: absolute; inset: 0; width: 100%; height: 100%; }
.vslot video { object-fit: cover; display: block; }
.video svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.vchip { position: absolute; left: 10px; top: 10px; background: rgba(14, 15, 17, .82); color: var(--fg); font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 99px; }
.vdur { position: absolute; right: 10px; bottom: 10px; background: rgba(14, 15, 17, .82); color: var(--fg); font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 8px; font-variant-numeric: tabular-nums; }
.vplay { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 68px; height: 68px; border-radius: 99px; border: 0; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; }
.vcap { position: absolute; left: 12px; right: 12px; top: 48px; text-align: center; }
.vcap span { background: rgba(0, 0, 0, .78); color: #FFFFFF; font-size: 15px; line-height: 1.4; padding: 3px 8px; border-radius: 6px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.vmsg { position: absolute; inset: 0; background: rgba(14, 15, 17, .9); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; text-align: center; font-size: 15px; }
.vtouch { position: absolute; inset: 0; background: none; border: 0; }
.vctrl { display: flex; flex-direction: column; gap: 10px; }
.vctrl .row { gap: 8px; flex-wrap: wrap; }
.chip { min-height: 48px; padding: 0 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ailabel { background: none; border: 0; color: var(--muted); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0; }
details.sum { background: var(--surface); border-radius: 16px; border: 1px solid var(--line); }
details.sum summary { min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-weight: 600; cursor: pointer; list-style: none; }
details.sum summary::-webkit-details-marker { display: none; }
details.sum ul { margin: 0; padding: 0 16px 16px 36px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; color: #D8DADF; }
/* Reto y evaluación */
.q { font-size: 24px; line-height: 1.25; font-weight: 800; letter-spacing: -0.01em; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { width: 100%; min-height: 56px; text-align: left; background: var(--surface); border: 1.5px solid var(--line2); border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; font-size: 17px; line-height: 1.35; }
.opt .rad { width: 22px; height: 22px; border-radius: 99px; border: 2px solid var(--line2); flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; }
.opt[aria-checked="true"] { border-color: var(--accent); }
.opt[aria-checked="true"] .rad { border-color: var(--accent); }
.opt[aria-checked="true"] .rad::after { content: ""; width: 10px; height: 10px; border-radius: 99px; background: var(--accent); }
.opt.right { border-color: var(--ok); }
.opt.wrong { border-color: var(--rep); }
.opt .tag { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; margin-top: 6px; }
.opt.right .tag { color: var(--ok); }
.opt.wrong .tag { color: var(--rep); }
.opt:disabled { cursor: default; color: var(--fg); }
.fb { border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.fb.ok { background: var(--okbg); }
.fb.rep { background: var(--repbg); }
.fb .h { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; }
.fb.ok .h { color: var(--ok); }
.fb.rep .h { color: var(--rep); }
.fb p { font-size: 16px; color: var(--fg); }
.rules { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.rule { background: var(--surface); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.rule .big { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.rule .ic { color: var(--accent); }
.qlist { display: flex; flex-direction: column; gap: 8px; }
.qitem { width: 100%; min-height: 56px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; text-align: left; }
.qitem .n { width: 32px; height: 32px; border-radius: 99px; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0; }
.qitem .t { flex: 1; min-width: 0; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score .big { font-size: 56px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.seal { width: 64px; height: 64px; border-radius: 99px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; }
.orbwrap { display: flex; justify-content: center; }
.orbwrap canvas { border-radius: 50%; box-shadow: 0 0 90px -10px var(--accent); }
/* Certificado */
.cert { background: var(--paper); color: var(--ink); border-radius: 16px; border-top: 8px solid var(--principal); padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.cert .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.cert .mono { background: var(--principal); color: #F2F2F0; }
.cert .co { font-weight: 800; font-size: 15px; color: var(--principal); }
.cert .kind { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }
.cert .name { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
.cert .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; border-top: 1px solid #E2DED6; padding-top: 12px; font-size: 12px; color: var(--ink2); }
.cert .grid b { display: block; font-size: 15px; color: var(--ink); }
.cert .foot { font-size: 11px; color: var(--ink2); }
.certitem { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; gap: 14px; align-items: center; }
.certitem .ic-wrap { width: 48px; height: 48px; border-radius: 14px; background: var(--principal); color: #F2F2F0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
/* Perfil */
.dl { display: flex; flex-direction: column; background: var(--surface); border-radius: 18px; }
.dl > div { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 16px; }
.dl > div:last-child { border-bottom: 0; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; text-align: right; font-weight: 600; }
.logo-hit { background: none; border: 0; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
/* Reglas de contraseña */
.prules { list-style: none; margin: 0; padding: 16px; background: var(--surface); border-radius: 16px; display: flex; flex-direction: column; gap: 10px; }
.prules li { display: flex; align-items: center; gap: 10px; font-size: 16px; }
.prules li .st { margin-left: auto; font-size: 13px; font-weight: 600; }
.prules li[data-ok="true"] .st { color: var(--ok); }
.prules li[data-ok="false"] .st { color: var(--muted); }
.prules li[data-ok="miss"] .st { color: var(--rep); }
.prules li .ic { color: var(--muted); }
.prules li[data-ok="true"] .ic { color: var(--ok); }
.codebox { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.codebox input { min-height: 56px; text-align: center; font-size: 22px; font-weight: 800; padding: 0; }
/* Hojas y avisos */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .62); z-index: 40; }
.sheet { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(480px, 100%); max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0; z-index: 41; display: flex; flex-direction: column; gap: 16px; padding-block: 12px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: var(--gl); padding-right: var(--gr); }
.sheet .grab { width: 40px; height: 4px; border-radius: 99px; background: var(--line2); align-self: center; }
.radio { min-height: 56px; width: 100%; text-align: left; background: var(--bg); border: 1.5px solid var(--line2); border-radius: 14px; padding: 0 16px; display: flex; align-items: center; gap: 12px; font-size: 16px; }
.radio[aria-checked="true"] { border-color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: 15px; font-weight: 600; width: max-content; max-width: calc(100% - 32px); display: flex; gap: 8px; align-items: center; }
.sk { background: var(--surface2); border-radius: 14px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; padding: 40px 8px; }
.empty .ic { color: var(--muted); }
/* Demostración */
.demotab { position: fixed; right: env(safe-area-inset-right, 0px); top: 38%; z-index: 35; background: var(--demo); color: var(--bg); border: 0; border-radius: 12px 0 0 12px; min-height: 48px; min-width: 48px; padding: 10px 8px; font-size: 12px; font-weight: 800; letter-spacing: .08em; writing-mode: vertical-rl; transform: rotate(180deg); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { min-height: 44px; padding: 0 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line2); font-size: 14px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.dlabel { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.switch { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; background: var(--bg); border: 1px solid var(--line2); border-radius: 12px; padding: 0 14px; font-size: 15px; font-weight: 600; }
.switch .knob { width: 44px; height: 26px; border-radius: 99px; background: var(--line2); position: relative; flex-shrink: 0; }
.switch .knob::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 99px; background: var(--muted); }
.switch[aria-checked="true"] .knob { background: var(--fg); }
.switch[aria-checked="true"] .knob::after { left: 21px; background: var(--bg); }
.creds { font-size: 13px; color: var(--muted); line-height: 1.6; font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
/* Corte 2: sin señal, descargas y avance pendiente */
:root { --demo-h: 0px; }
body.demo-on { --demo-h: calc(56px + env(safe-area-inset-bottom, 0px)); }

function routeStats() {
  const c = C(); const p = prog(); const ls = allLessons(c.route);
  const total = ls.length + 1;
  const doneUnits = ls.filter((l) => p.completed.includes(l.id)).length + (p.passed ? 1 : 0);
  const pct = Math.round(doneUnits / total * 100);
  const remaining = ls.filter((l) => !p.completed.includes(l.id)).length * 6 + (p.passed ? 0 : c.rules.minutes);
  const next = ls.find((l) => !p.completed.includes(l.id)) || null;
  const per = P();
  return { pct, remaining, next, total, allLessonsDone: !next, due: per.due, late: daysTo(per.due) < 0 && !p.passed };
}
function levelState(li) {
  const p = prog(); const lv = C().route.levels[li];
  const doneIn = lv.lessons.filter((l) => p.completed.includes(l.id)).length;
  if (doneIn === lv.lessons.length) return 'done';
  const prevDone = li === 0 || C().route.levels[li - 1].lessons.every((l) => p.completed.includes(l.id));
  if (!prevDone) return 'lock';

}

}

SCREENS.rules = function () {

  let reason = '';
  if (S.offline) reason = 'Conéctate para empezar. La evaluación necesita señal.';
  else if (exhausted) reason = 'Usaste tus ' + r.attempts + ' intentos. ' + r.exhausted;
  else if (wait) reason = 'Podrás reintentar hoy a las ' + fHM(wait) + '.';
  const disabled = !!reason;
  return topBar('Evaluación final · ' + c.route.title, 0, 'toRoute') + offlineBar() + '<main class="scr">' +
    '<div class="stack-s"><p class="over">Antes de empezar</p><h1 class="title">Reglas de la <b>evaluación</b></h1></div>' +
    '<div class="rules">' +
      '<div class="rule">' + icon('target', 24) + '<span class="big">' + r.min + ' %</span><span class="small">Apruebas con ' + r.min + ' % o más</span></div>' +
      '<div class="rule">' + icon('redo', 24) + '<span class="big">' + Math.max(0, left) + ' de ' + r.attempts + '</span><span class="small">Intentos que te quedan</span></div>' +
      '<div class="rule">' + icon('clock', 24) + '<span class="big">' + (r.wait ? (r.wait === 60 ? '1 hora' : r.wait + ' min') : 'Sin espera') + '</span><span class="small">' + (r.wait ? 'Si no apruebas, esperas ' + (r.wait === 60 ? '1 hora' : r.wait + ' min') + ' para reintentar' : 'Si no apruebas, puedes reintentar enseguida') + '</span></div>' +

    '</div>' +

/* ---------- Corte 2: descargas, señal y avance pendiente ---------- */
function dlOf(id) { return (S.persona && prog().downloads[id]) || { state: 'none', pct: 0, fails: 0 }; }
function isReady(id) { return dlOf(id).state === 'ready'; }
function busyOrReady(id) { return ['ready', 'dl', 'queue'].includes(dlOf(id).state); }
function isPending(id) { return prog().pending.some((x) => x.lid === id); }
function fMB(mb) { return mb >= 1000 ? (mb / 1000).toFixed(1).replace('.', ',') + ' GB' : Math.max(0, Math.round(mb)) + ' MB'; }
function usedMB() { return allLessons(C().route).filter((l) => isReady(l.id)).reduce((s, l) => s + l.mb, 0); }
function sumMB(ids) { return ids.reduce((s, id) => s + lessonById(id).mb, 0); }
function nextToDownload() { const pr = prog(); return allLessons(C().route).filter((l) => !pr.completed.includes(l.id) && !busyOrReady(l.id)).slice(0, 2); }
function completedReady() { const pr = prog(); return allLessons(C().route).filter((l) => pr.completed.includes(l.id) && isReady(l.id)); }

function connBar() {
  const pr = prog(); const n = pr.pending.length;
  let ic = 'cloud', t = 'Todo tu avance está guardado', cls = ' ok';
  if (S.offline) { ic = n ? 'clock' : 'nosignal'; cls = ''; t = n ? 'Sin señal · ' + n + (n === 1 ? ' lección pendiente' : ' lecciones pendientes') + ' de enviar' : 'Sin señal · Puedes usar tus lecciones descargadas'; }
  else if (pr.sendState === 'sending') { ic = 'sync'; cls = ''; t = 'Enviando tu avance…'; }
  else if (pr.sendState === 'error') { ic = 'redo'; cls = ' warn'; t = 'No pudimos enviar tu avance · Reintentar'; }
  else if (n) { ic = 'clock'; cls = ''; t = n + (n === 1 ? ' lección pendiente' : ' lecciones pendientes') + ' de enviar'; }
  return '<button class="conn' + cls + '" data-a="syncInfo" aria-label="' + esc(t) + '. Ver detalle">' + icon(ic, 20) + '<span class="t">' + esc(t) + '</span>' + icon('chev', 18) + '</button>';
}
function dlBadge(L) {
  const d = dlOf(L.id);
  if (d.state === 'ready') return '<span class="dlb ready">' + icon('phoneok', 16) + 'Lista sin señal</span>';
  if (d.state === 'queue') return '<span class="dlb">' + icon('clock', 16) + 'En espera</span>';
  if (d.state === 'dl') return '<span class="dlb dl"><span class="minibar"><i data-dlb="' + L.id + '" style="width:' + d.pct + '%"></i></span><span data-dlp="' + L.id + '">Descargando ' + Math.floor(d.pct) + ' %</span></span>' + (S.dlMode === 'lenta' ? '<span class="dlb">Esto puede demorar unos minutos</span>' : '');
  if (d.state === 'pause') return '<span class="dlb">' + icon('pause', 16) + 'En pausa · ' + Math.floor(d.pct) + ' %. Seguirá cuando vuelva la señal</span>';
  if (d.state === 'error') return '<span class="dlb err">' + icon('redo', 16) + 'No se pudo descargar</span>';
  return S.offline ? '<span class="dlb">' + icon('nosignal', 16) + 'Necesita señal</span>' : '<span class="dlb">' + icon('dl', 16) + 'Descargar · ' + L.mb + ' MB</span>';
}
function dlRow(L) {
  const pr = prog(); const d = dlOf(L.id); let act = '', badge = '';
  if (d.state === 'none') {
    if (!S.offline && !pr.completed.includes(L.id)) act = '<button class="mini" data-a="dlOne" data-id="' + L.id + '">' + icon('dl', 16) + 'Descargar · ' + L.mb + ' MB</button>';
  } else {
    badge = dlBadge(L);
    if (d.state === 'dl' || d.state === 'queue') act = '<button class="mini" data-a="cancelDl" data-id="' + L.id + '">Cancelar</button>';
    if (d.state === 'error') act = '<button class="mini" data-a="dlFailOpen" data-id="' + L.id + '">' + icon('redo', 16) + 'Intentar de nuevo</button>';
  }
  const pend = isPending(L.id) ? pill('pend', 'Pendiente de enviar', 'clock') : '';
  if (!badge && !act && !pend) return '';
  return '<div class="dlrow">' + badge + pend + act + '</div>';
}
function demoBar() {
  if (!S.demo || (S.sheet && S.sheet.type === 'demo')) return '';
  const pr = S.persona ? prog() : null;
  return '<div class="demobar" role="region" aria-label="Controles de demostración"><span class="lbl">DEMO</span>' +
    '<button data-a="dSignal" class="' + (S.offline ? 'on' : '') + '" aria-pressed="' + S.offline + '">' + icon(S.offline ? 'nosignal' : 'cloud', 16) + (S.offline ? ' Sin señal' : ' Con señal') + '</button>' +
    '<button data-a="dDl">Descargas: <b>' + { normal: 'Normales', lenta: 'Lentas', falla: 'Fallan' }[S.dlMode] + '</b></button>' +
    '<button data-a="dSend">Envío: <b>' + (S.sendMode === 'ok' ? 'Funciona' : 'Falla') + '</b></button>' +
    '<button data-a="dSpace"' + (pr ? '' : ' disabled') + '>Espacio: <b>' + (pr ? fMB(pr.freeMB) : '—') + '</b></button>' +
    '<button data-a="openDemo">Más</button></div>';
}

function requestDownload(ids) {
  ids = ids.filter((id) => !busyOrReady(id));
  if (!ids.length) { toast('Ya tienes esas lecciones descargadas'); render(); return; }
  if (sumMB(ids) > prog().freeMB) { S.sheet = { type: 'noSpace', ids }; render(); return; }
  S.sheet = { type: 'confirmDl', ids }; render();
}
function confirmDownload(ids) {
  const pr = prog(); const need = sumMB(ids);
  if (need > pr.freeMB) { S.sheet = { type: 'noSpace', ids }; render(); return; }
  ids.forEach((id) => { const d = dlOf(id); pr.downloads[id] = { state: 'queue', pct: d.pct || 0, fails: d.fails || 0 }; });
  pr.freeMB -= need;
  S.sheet = null;
  if (S.screen === 'select') go('route'); else render();
}
function removeDownload(id) { const pr = prog(); if (!pr.downloads[id]) return; pr.freeMB += lessonById(id).mb; delete pr.downloads[id]; }
function tickDownloads(dt) {
  if (S.offline) return false;
  const pr = prog(); const ls = allLessons(C().route);
  let cur = ls.find((l) => dlOf(l.id).state === 'dl');
  if (!cur) {
    cur = ls.find((l) => dlOf(l.id).state === 'queue');
    if (!cur) return false;
    const d = pr.downloads[cur.id]; d.state = 'dl';
    d.failAt = S.dlMode === 'falla' ? (d.pct < 40 ? 40 : Math.min(99, d.pct + 8)) : null;
    render(); return true;
  }
  const d = pr.downloads[cur.id];
  d.pct = Math.min(100, d.pct + dt * (S.dlMode === 'lenta' ? 5 : 34));
  if (d.failAt != null && d.pct >= d.failAt) {
    d.pct = Math.floor(d.failAt); d.state = 'error'; d.fails++;
    if (!S.sheet) S.sheet = { type: 'dlFail', id: cur.id };
    render(); return true;
  }
  if (d.pct >= 100) { d.state = 'ready'; d.pct = 100; toast('Listo. «' + cur.title + '» ya está lista para ver sin señal.', 3200); render(); return true; }
  document.querySelectorAll('[data-dlp="' + cur.id + '"]').forEach((el) => { el.textContent = 'Descargando ' + Math.floor(d.pct) + ' %'; });
  document.querySelectorAll('[data-dlb="' + cur.id + '"]').forEach((el) => { el.style.width = d.pct + '%'; });
  return false;
}
function flash(t) { S.flash = t; S.flashUntil = Date.now() + 4000; }
function setOffline(v) {
  if (S.offline === v) return;
  S.offline = v;
  if (!S.persona) { render(); return; }
  const pr = prog();
  if (v) {
    flash('Te quedaste sin señal. Tus lecciones descargadas siguen funcionando.');
    Object.keys(pr.downloads).forEach((k) => { const d = pr.downloads[k]; if (d.state === 'dl' || d.state === 'queue') d.state = 'pause'; });
    if (pr.exam && !pr.exam.done && (S.screen === 'exam' || S.screen === 'review')) pr.exam.interrupted = true;
    if (S.screen === 'lesson' && S.video && !isReady(S.params.id) && ['playing', 'loading'].includes(S.video.phase)) S.video.phase = 'lost';
    if (pr.sendState === 'sending') pr.sendState = 'idle';
  } else {
    Object.keys(pr.downloads).forEach((k) => { const d = pr.downloads[k]; if (d.state === 'pause') d.state = 'queue'; });
    if (pr.pending.length) { flash('Volvió la señal. Enviando tu avance…'); sendPending(); return; }
    flash('Volvió la señal.');
  }
  render();
}
function sendPending() {
  const pr = prog(); if (!pr.pending.length || S.offline) { render(); return; }
  pr.sendState = 'sending'; render();
  setTimeout(() => {
    if (S.offline) { pr.sendState = 'idle'; render(); return; }
    if (S.sendMode === 'falla') { pr.sendState = 'error'; render(); return; }
    pr.pending = []; pr.sendState = 'idle'; toast('Tu avance ya está guardado', 3000); render();
  }, 1800);
}

function examInterrupted() {
  const ex = prog().exam; const ans = ex.answers.filter((a) => a != null).length;
  return topBar('Evaluación final', ans / ex.qs.length * 100, 'toRoute') + offlineBar() + '<main class="scr">' +

    (S.offline ? '<div class="banner info" role="status">' + icon('nosignal', 20) + '<span>Se fue la señal. Tus respuestas están guardadas y el tiempo está en pausa.</span></div>'
      : '<div class="banner info" role="status">' + icon('check', 20) + '<span>Volvió la señal. Puedes seguir donde te quedaste.</span></div>') +
    '<div class="block"><span class="score"><span class="big">' + ans + '</span><span class="muted">de ' + ex.qs.length + ' respondidas</span></span><span class="row small">' + icon('timer', 20) + '<span>Te quedan ' + fClock(ex.remaining) + '</span></span></div>' +
    '</main><div class="dock"><button class="btn btn-primary" data-a="resumeExam"' + (S.offline ? ' disabled' : '') + '>Reanudar evaluación</button>' +

SCREENS.select = function () {

    '<button class="btn btn-primary" data-a="dlSelected"' + (ids.length ? '' : ' disabled') + '>' + icon('dl', 20) + 'Descargar ' + tot + ' MB</button></div>';

  }
  if (sh.type === 'noSignal') {

    return '<span class="muted">' + icon('nosignal', 32) + '</span><h2 class="h2">' + (sh.noDl ? 'Para seguir sin señal, primero descarga tus lecciones' : 'Esto necesita señal') + '</h2><p class="muted">' + (sh.noDl ? 'Hazlo cuando tengas señal.' : 'No lo descargaste antes.') + '</p>' +
      (ready.length ? '<p class="small" style="font-weight:600">Puedes hacer ahora:</p><div class="stack" style="gap:8px">' + ready.map((l) => '<button class="lessonbtn" data-a="openLesson" data-id="' + l.id + '">' + icon('phoneok', 20) + '<span class="t">' + esc(l.title) + '<span class="xs muted" style="display:block;font-weight:400">Lección y reto · Lista sin señal</span></span>' + icon('chev', 20) + '</button>').join('') +
        '<button class="lessonbtn" data-a="go" data-to="certs">' + icon('award', 20) + '<span class="t">Mis certificados</span>' + icon('chev', 20) + '</button></div><button class="btn btn-primary" data-a="go" data-to="downloads">Ver mis lecciones descargadas</button>'
        : '<p class="small">Cuando tengas señal, descarga lo que sigue.</p><button class="btn btn-primary" data-a="go" data-to="home">Volver a Inicio</button>') +
      '<button class="btn btn-sec" data-a="closeSheet">Cerrar</button>';
  }
  if (sh.type === 'sync') {
    const n = pr.pending.length; let head, txt = '', btn = '<button class="btn btn-primary" data-a="closeSheet">Entendido</button>';
    if (pr.sendState === 'sending') head = 'Enviando tu avance…';
    else if (pr.sendState === 'error' && !S.offline) { head = 'No pudimos enviar tu avance'; txt = 'Sigue guardado en este celular.'; btn = '<button class="btn btn-primary" data-a="retrySend">' + icon('redo', 20) + 'Reintentar</button><button class="btn btn-sec" data-a="closeSheet">Cerrar</button>'; }
    else if (n) { head = 'Tu avance está guardado en este celular'; txt = S.offline ? 'Se enviará solo cuando vuelva la señal.' : 'Lo enviaremos en un momento.'; if (!S.offline) btn = '<button class="btn btn-primary" data-a="retrySend">Enviar ahora</button>'; }
    else { head = 'Todo tu avance está guardado'; txt = S.offline ? 'Sin señal puedes seguir con tus lecciones descargadas.' : 'No tienes nada pendiente de enviar.'; }
    return '<h2 class="h2">' + head + '</h2>' + (txt ? '<p class="muted">' + txt + '</p>' : '') +
      (n ? '<div class="stack" style="gap:8px">' + pr.pending.map((p) => '<div class="row small">' + icon('clock', 18) + '<span>' + esc(p.label) + ' · hoy ' + p.at + '</span></div>').join('') + '</div>' : '') + btn;
  }
  return '';
}

function applyTheme() {

/* Un solo elemento de video que se mueve a la lección abierta, para no recargarlo en cada pintado */
const VID = document.createElement('video');
VID.src = VSRC; VID.poster = VPOSTER; VID.preload = 'metadata'; VID.playsInline = true;
VID.setAttribute('playsinline', ''); VID.setAttribute('aria-label', 'Video de la lección');
VID.addEventListener('playing', () => { if (S.screen === 'lesson' && S.video && S.video.phase === 'loading') { S.video.phase = 'playing'; render(); } });
VID.addEventListener('ended', () => {
  if (S.screen !== 'lesson' || !S.video || !S.persona) return;
  S.video.phase = 'ended'; const pr = prog(); pr.videoPos[S.params.id] = VDUR; pr.watched[S.params.id] = true; render();
});
VID.addEventListener('error', () => { if (S.screen === 'lesson' && S.video && S.video.phase === 'loading') { S.video.phase = 'error'; render(); } });
function attachVideo() {
  const slot = document.getElementById('vslot');
  if (!slot || !S.video) { if (!VID.paused) VID.pause(); return; }
  slot.appendChild(VID);
  VID.playbackRate = S.video.speed;
  if (S.video.seekTo != null) {
    const t = Math.min(S.video.seekTo, VDUR - 0.2); S.video.seekTo = null;
    if (VID.readyState >= 1) { try { VID.currentTime = t; } catch (e) { /* aún sin datos */ } }
    else VID.addEventListener('loadedmetadata', () => { try { VID.currentTime = t; } catch (e) { /* aún sin datos */ } }, { once: true });
  }
  const want = S.video.phase === 'loading' || S.video.phase === 'playing';
  if (want) { const p = VID.play(); if (p && p.catch) p.catch(() => { if (S.video) { S.video.phase = 'paused'; render(); } }); }
  else if (!VID.paused) VID.pause();
}

function go(to, params) {
  if (to === 'rules' && !routeStats().allLessonsDone && !prog().passed) { S.sheet = { type: 'locked', lv: 'exam' }; render(); return; }
  if (to === 'rules' && S.offline) to = 'examOffline';

  if (to === 'select') S.sel = new Set();
  if (to !== S.screen) S.prev = S.screen;
  S.screen = to; S.params = params || {}; S.sheet = null; S.form = {}; S.dl = null;

}
function openLesson(id, pos) {

function login(email, pass) {
  const e = email.trim().toLowerCase();
  const k = personaByEmail(e);
  if (!e) { S.form = { email, pass, err: 'email', msg: 'Escribe tu correo.' }; render(); return; }
  if (!pass) { S.form = { email, pass, err: 'pass', msg: 'Escribe tu contraseña.' }; render(); return; }
  S.form = { email, pass, busy: true }; render();
  setTimeout(() => {
    if (!k || !prog(S.client, k).password || prog(S.client, k).password !== pass) { S.form = { email, pass: '', err: 'pass', msg: 'El correo o la contraseña no coinciden. Revisa e intenta de nuevo.' }; render(); return; }
    S.persona = k; enterAs();
  }, 500);
}
function emailOf(k) { return k + '@' + (C().slug || C().id.toLowerCase()) + '.example'; }
function personaByEmail(e) { return PERSONA_ORDER.find((x) => emailOf(x) === e) || null; }
function enterAs() {
  const pr = prog();
  if (pr.firstLogin) { go('newpass', { mode: 'first' }); S.form = { temp: pr.password }; render(); }
  else go('home');
  if (P().startOffline && !S.offline) setOffline(true);
}

function startExam() {
  const pr = prog(); const c = C();
  if (!pr.exam || pr.exam.done) pr.exam = { qs: examQuestions(), answers: new Array(c.rules.n).fill(null), idx: 0, remaining: c.rules.minutes * 60, done: false };
  go('exam');
}
function submitExam() {
  const pr = prog(); const c = C(); const ex = pr.exam; const r = c.rules;
  let correct = 0; const wrongL = [];
  ex.qs.forEach((x, i) => { const q = lessonById(x.lid).qs[x.qi]; if (ex.answers[i] === q.right) correct++; else if (!wrongL.includes(x.lid)) wrongL.push(x.lid); });
  let score = Math.round(correct / ex.qs.length * 100);
  let pass = score >= r.min;
  if (S.forceResult === 'pass') { pass = true; score = Math.max(score, 90); }
  if (S.forceResult === 'fail' || S.forceResult === 'exhaust') { pass = false; score = Math.min(score, r.min - 20); }
  ex.done = true;
  if (pass) {
    pr.passed = true; pr.score = score;
    const issued = now(); const expires = new Date(issued.getFullYear() + 1, issued.getMonth(), issued.getDate());
    pr.certs.push({ route: c.route.title, issued, expires, score, code: certCode(c.id, S.persona, issued) });
  } else {
    pr.attempts = S.forceResult === 'exhaust' ? r.attempts : pr.attempts + 1;
    pr.lastFail = S.simOffset;
    if (!wrongL.length) wrongL.push(allLessons(c.route)[0].id);
  }
  go('result', { pass, score, topics: pass ? [] : wrongL.slice(0, 3) });
}

      break;

    }

    case 'cc': S.video.cc = !S.video.cc; render(); break;
    case 'speed': { const sp = [0.75, 1, 1.25, 1.5]; S.video.speed = sp[(sp.indexOf(S.video.speed) + 1) % sp.length]; render(); break; }
    case 'fullscreen': { const b = document.getElementById('vbox'); try { const p = b.requestFullscreen ? b.requestFullscreen() : b.webkitRequestFullscreen ? b.webkitRequestFullscreen() : (VID.webkitEnterFullscreen && VID.webkitEnterFullscreen()); if (p && p.catch) p.catch(() => { toast('Pantalla completa no disponible aquí'); render(); }); } catch (err) { toast('Pantalla completa no disponible aquí'); render(); } break; }
    case 'readSummary': S.video.sumOpen = true; pr.watched[S.params.id] = true; if (S.video.phase !== 'playing') S.video.phase = 'idle'; render(); setTimeout(() => { const d = document.getElementById('sumd'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30); break;

    case 'sendReport': S.sheet.sent = true; render(); setTimeout(() => { if (S.sheet && S.sheet.type === 'report') { S.sheet = null; render(); } }, 3000); break;
    case 'closeSheet': S.sheet = null; render(); break;
    case 'startQuiz': { const id = el.dataset.id || S.params.id; S.quiz = { lessonId: id, idx: 0, sel: null, checked: false, results: [] }; go('quiz', { id }); break; }
    case 'pick': S.quiz.sel = +el.dataset.i; render(); break;
    case 'checkQ': { const L = lessonById(S.quiz.lessonId); S.quiz.checked = true; S.quiz.results[S.quiz.idx] = S.quiz.sel === L.qs[S.quiz.idx].right; render(); break; }
    case 'nextQ': {

      else {

        if (S.offline && !isPending(L.id)) pr.pending.push({ lid: L.id, label: 'Reto de «' + L.title + '»', at: fHM(now()) });

    case 'confirmExitExam': go('route'); break;
    case 'reconnect': if (S.offline) toast('Aún sin señal. Tus respuestas siguen guardadas.'); else toast('Conexión recuperada'); render(); break;
    case 'submitExam': submitExam(); break;

      break;

    case 'retry': S.gate = null; render(); break;
    case 'openDemo': S.sheet = { type: 'demo' }; render(); break;
    case 'dClient': S.client = el.dataset.v; if (S.persona) go('home'); else render(); break;
    case 'dPersona': S.persona = el.dataset.v; S.sheet = null; enterAs(); break;
    case 'dOffline': setOffline(!S.offline); break;
    case 'dSignal': setOffline(!S.offline); break;
    case 'dDl': { const m = ['normal', 'lenta', 'falla']; S.dlMode = m[(m.indexOf(S.dlMode) + 1) % 3]; render(); break; }
    case 'dSend': S.sendMode = S.sendMode === 'ok' ? 'falla' : 'ok'; render(); break;
    case 'dSpace': { if (!pr) break; const opts = [3400, 300, 40]; const i = opts.indexOf(pr.freeMB); pr.freeMB = opts[(i + 1) % 3]; render(); break; }
    case 'syncInfo': S.sheet = { type: 'sync' }; render(); break;
    case 'retrySend': S.sheet = null; sendPending(); break;
    case 'dlNext': { const nx = nextToDownload(); if (!nx.length) { toast('Ya tienes descargado lo que sigue'); render(); break; } requestDownload(nx.map((l) => l.id)); break; }
    case 'dlOne': requestDownload([el.dataset.id]); break;
    case 'selOne': { const id = el.dataset.id; if (S.sel.has(id)) S.sel.delete(id); else S.sel.add(id); render(); break; }
    case 'selLevel': {
      const lv = C().route.levels[+el.dataset.lv];
      const avail = lv.lessons.map((l) => l.id).filter((id) => !busyOrReady(id));
      const all = avail.every((id) => S.sel.has(id));
      avail.forEach((id) => { if (all) S.sel.delete(id); else S.sel.add(id); }); render(); break;
    }
    case 'dlSelected': requestDownload(Array.from(S.sel)); break;
    case 'confirmDl': confirmDownload(S.sheet.ids); break;
    case 'cancelDl': removeDownload(el.dataset.id); toast('Cancelaste la descarga. Puedes hacerla cuando quieras.'); render(); break;
    case 'dlFailOpen': S.sheet = { type: 'dlFail', id: el.dataset.id }; render(); break;
    case 'retryDl': { const d = pr.downloads[el.dataset.id]; if (d) d.state = 'queue'; S.sheet = null; render(); break; }
    case 'askRemove': {
      const st = dlOf(el.dataset.id).state;
      if (st === 'dl' || st === 'queue') { removeDownload(el.dataset.id); toast('Cancelaste la descarga. Puedes hacerla cuando quieras.'); }
      else S.sheet = { type: 'removeDl', id: el.dataset.id };
      render(); break;
    }
    case 'removeDlNow': case 'removeNow': { const l = lessonById(el.dataset.id); removeDownload(l.id); S.sheet = null; toast('Quitaste «' + l.title + '». Liberaste ' + l.mb + ' MB.'); render(); break; }
    case 'keepDl': pr.kept[el.dataset.id] = true; toast('Mantendremos la descarga'); render(); break;
    case 'removeCompleted': { const comp = completedReady(); const mb = comp.reduce((s, l) => s + l.mb, 0); comp.forEach((l) => removeDownload(l.id)); toast('Liberaste ' + mb + ' MB. Tu avance no se borra.'); render(); break; }
    case 'freeCompleted': { completedReady().forEach((l) => removeDownload(l.id)); if (pr.freeMB >= sumMB(S.sheet.ids)) S.sheet.freed = true; render(); break; }
    case 'selectLess': S.sheet = null; go('select'); break;
    case 'spaceTip': S.sheet.tip = true; render(); break;
    case 'retryExam': if (S.offline) { toast('Aún sin señal. Prueba en otra zona.'); render(); } else go('rules'); break;
    case 'resumeExam': pr.exam.interrupted = false; render(); break;
    case 'back': go(['home', 'profile', 'route'].includes(S.prev) ? S.prev : 'home'); break;
    case 'dVideoFail': S.videoFail = !S.videoFail; render(); break;
    case 'dForce': S.forceNext = el.dataset.v || null; render(); break;
    case 'dResult': S.forceResult = el.dataset.v || null; render(); break;
    case 'dSkipWait': S.simOffset += 61; toast('Pasó 1 hora en la demostración'); render(); break;
    case 'dReset': S.db = {}; S.simOffset = 0; S.dlMode = 'normal'; S.sendMode = 'ok'; S.flash = null; S.persona = null; S.offline = false; S.videoFail = false; S.forceNext = null; S.forceResult = null; go('login'); break;
    case 'dHide': S.demo = false; S.sheet = null; render(); break;
  }
});

});
document.addEventListener('toggle', (e) => {
  if (e.target.id === 'sumd' && S.video) { S.video.sumOpen = e.target.open; if (e.target.open && S.persona) { prog().watched[S.params.id] = true; const b = document.querySelector('[data-a="startQuiz"]'); if (b && b.disabled) render(); } }
}, true);

document.addEventListener('submit', (e) => {
  e.preventDefault(); const id = e.target.id;
  if (id === 'loginForm') { syncForm(); login(S.form.phone || '', S.form.pass || ''); }
  else if (id === 'npForm') {
    syncForm(); const f = S.form; const r = passRules(f.np1, f.temp || DEMO_PASS);
    if (!(r.len && r.num && r.diff)) { f.tried = true; f.msg = 'Tu contraseña aún no cumple todas las reglas.'; render(); return; }
    if (f.np1 !== f.np2) { f.tried = true; f.msg = 'Las dos contraseñas no coinciden.'; render(); return; }
    const mode = S.params.mode;
    // Como en el backend: crear la contraseña desde el enlace deja la sesión abierta.
    if (mode === 'forgot') { const k = f.who; prog(S.client, k).password = f.np1; prog(S.client, k).firstLogin = false; S.persona = k; enterAs(); toast('Listo, tu contraseña nueva quedó guardada'); render(); return; }
    const pr = prog(); pr.password = f.np1; pr.firstLogin = false;
    if (mode === 'first') { if (!pr.area) { go('ficha'); } else go('home'); toast('Contraseña guardada'); render(); }
    else { go('profile'); toast('Contraseña actualizada'); render(); }
  } else if (id === 'fichaForm') {
    const v = (document.getElementById('area') || {}).value;
    if (!v) { S.form.err = true; render(); return; }
    prog().area = v; go('home');
  } else if (id === 'fg1') {
    const e = (S.form.email || '').trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) { S.form.msg = 'Escribe un correo válido, por ejemplo nombre@empresa.com.'; render(); return; }
    S.form = { email: e, who: personaByEmail(e), sent: true }; render();
  }
});

/* Panel de demostración oculto: mantener presionado el logo 2 s */
let lpTimer = 0;
document.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('[data-longpress]'); if (!el) return;
  lpTimer = setTimeout(() => { S.demo = true; S.sheet = { type: 'demo' }; render(); }, 2000);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach((t) => document.addEventListener(t, () => clearTimeout(lpTimer)));
document.addEventListener('contextmenu', (e) => { if (e.target.closest('[data-longpress]')) e.preventDefault(); });

/* ---------- Reloj del prototipo ---------- */
let lastT = Date.now();
setInterval(() => {
  const t = Date.now(); const dt = (t - lastT) / 1000; lastT = t;
  if (S.flash && t > S.flashUntil) { S.flash = null; const fe = document.querySelector('.flash'); if (fe) fe.remove(); }
  if (S.persona && tickDownloads(dt)) return;
  if (S.screen === 'lesson' && S.video && S.video.phase === 'playing' && S.persona) {
    const L = lessonById(S.params.id); const pr = prog();
    if (S.offline && !isReady(L.id)) { S.video.phase = 'lost'; render(); return; }
    pr.videoPos[L.id] = Math.min(L.dur, VID.currentTime || 0);
    if (pr.videoPos[L.id] >= L.dur) { S.video.phase = 'ended'; pr.watched[L.id] = true; render(); }
    else {
      const pos = pr.videoPos[L.id];
      const b = document.getElementById('vbar'); if (b) b.style.width = (pos / L.dur * 100) + '%';
      const tm = document.getElementById('vtime'); if (tm) tm.textContent = fClock(pos) + ' / ' + fClock(L.dur);
      const cp = document.querySelector('#vcap span'); if (cp) cp.textContent = L.sum[Math.min(L.sum.length - 1, Math.floor(pos / L.dur * L.sum.length))];
    }
  }
  if (S.persona) {
    const pr = prog();
    if (pr.exam && !pr.exam.done && !S.offline && !pr.exam.interrupted) {
      pr.exam.remaining -= dt;
      if (pr.exam.remaining <= 0) { pr.exam.remaining = 0; toast('Se acabó el tiempo. Enviamos lo que respondiste.', 4000); submitExam(); return; }
      const el = document.getElementById('etimer'); if (el) el.textContent = fClock(pr.exam.remaining);
    }
  }
  if (S.gate === 'cargando' && !S.gateSlow && t - S.gateSince > 8000) { S.gateSlow = true; render(); }
  if (S.toast && t > S.toastUntil) { S.toast = null; const el = document.querySelector('.toast'); if (el) el.remove(); }
}, 250);

const def = Object.values(CLIENTS).find((c) => c.default);
if (def) S.client = def.id;
render();
})();
</script>
